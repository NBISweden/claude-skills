schema_version: "1.1"
name: safe-setup-enforced
expected_outcome: |
  End to end: the project already has the settings safe-setup writes for
  support work, its canary and the probe. With the sandbox on, the probe
  shows ~/.ssh, the canary's content, the data file and an unlisted host
  refused, and a write in the project allowed. The data file's content
  never appears. Needs the sandbox to start (CI installs bubblewrap and
  socat); if it cannot, Claude Code refuses to start and the case fails.
context:
  scaffold_script: place-files.sh
