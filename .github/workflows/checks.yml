name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.318

      - name: Validate marketplace and plugins
        run: |
          claude plugin validate --strict .
          for p in plugins/*/; do claude plugin validate --strict "$p"; done

      - name: Check repository rules
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: scripts/check-structure.sh "$BASE"

      - name: CODEOWNERS is valid
        # GitHub silently ignores lines it cannot use, such as an unknown user.
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          errors=$(gh api "repos/$GITHUB_REPOSITORY/codeowners/errors?ref=$REF" \
            --jq '.errors[] | "CODEOWNERS:\(.line): \(.message)"')
          [ -z "$errors" ] || { echo "$errors"; exit 1; }

      - name: Shellcheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck

      - name: Plugin tests
        run: |
          fail=0
          for t in plugins/*/tests/*.sh; do
            [ -e "$t" ] || continue
            echo "== $t"
            bash "$t" || fail=1
          done
          exit "$fail"

      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  evals:
    # Evals call the Anthropic API and cost money: a maintainer adds the
    # run-evals label to a pull request to run them for the plugins it changes.
    # Pull requests from forks get no secrets, so they are skipped (see CONTRIBUTING.md).
    if: >-
      github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'run-evals')
      && github.event.pull_request.head.repo.full_name == github.repository
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The key lives in this environment only; its required reviewer approves each run.
    environment: evals
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Claude Code and the sandbox dependencies
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.318
          sudo apt-get update && sudo apt-get install -y bubblewrap socat

      - name: Let bubblewrap create user namespaces
        # Ubuntu's AppArmor rules stop the Claude Code sandbox; the runner is thrown away afterwards.
        run: |
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict || true
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-user true

      - name: Find changed plugins
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Plugin names are data from the pull request: keep only slugs (check-structure.sh rejects others).
          plugins=$(git diff --name-only "origin/$BASE_REF...HEAD" -- plugins | cut -d/ -f2 | sort -u \
            | { grep -E '^[a-z0-9][a-z0-9-]*$' || true; } | tr '\n' ' ')
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "Changed plugins: ${plugins:-none}"

      - name: Run evals
        if: steps.changed.outputs.plugins != ''
        env:
          PLUGINS: ${{ steps.changed.outputs.plugins }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::The ANTHROPIC_API_KEY secret is not set; ask a repository admin to add it."
            exit 1
          fi
          mkdir -p eval-reports
          fail=0
          for p in $PLUGINS; do   # unquoted on purpose: a space-separated list of slugs
            claude plugin eval "plugins/$p" --runs 1 --model sonnet \
              --scaffold --allow-tools Bash Write Edit --trust-plugin --no-publish --judge-model sonnet \
              --max-cost-usd 5 --threshold 1 --report "eval-reports/$p.html" || fail=1
          done
          exit "$fail"

      - name: Upload eval reports
        if: always() && steps.changed.outputs.plugins != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-reports
          path: eval-reports/
